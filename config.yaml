# Experiment configuration
# Contrastive Failure Embeddings for Automated Recurrence Detection
# in Data Lakehouse Platforms

data:
  n_records: 60000
  n_classes: 6
  input_dim: 28
  records_per_class: 10000          # uniform distribution across classes
  random_seed: 42
  split_ratios: [0.70, 0.15, 0.15]  # train / val / test
  hard_negative_fraction: 0.20      # fraction of test set that is hard negatives
  output_dir: data/

  # Feature group sizes (must sum to input_dim)
  resource_features: 8
  shuffle_features: 12
  error_features: 8

  # Out-of-distribution scale multipliers for Experiment 4
  ood_scale_train: [1.0, 3.5]       # scale range seen during training
  ood_scale_test: [3.0, 5.5]        # scale range withheld for OOD evaluation

model:
  hidden_dim: 128                   # width of each MLP hidden layer
  embedding_dim: 32                 # output embedding dimensionality (primary)
  projection_hidden_dim: 64        # projection head intermediate dim
  projection_output_dim: 128       # projection head output dim (loss computed here)
  n_layers: 3                       # encoder depth (primary)
  batch_norm: true
  activation: relu
  l2_normalize: true                # L2-normalize embeddings to unit hypersphere

training:
  optimizer: adam
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 256
  class_stratified_sampling: true
  n_epochs: 200
  warmup_epochs: 10                 # linear warmup before cosine decay
  lr_schedule: cosine               # cosine decay after warmup

  # Primary loss function for main comparative experiments
  loss_function: supcon
  temperature: 0.07                 # NT-Xent / SupCon temperature parameter
  seeds: [0, 1, 2, 3, 4]          # five seeds for all reported results

  # Triplet loss margin (used only in ablation)
  triplet_margin: 0.5

  checkpoint_dir: runs/
  save_best: true                   # save checkpoint with best validation F1

hardware:
  device: cpu                       # set to 'cpu' if no GPU available
  num_workers: 4                    # DataLoader worker processes

baseline:
  # Threshold for cosine similarity matching
  # Tuned on validation set to maximise F1; this value is the starting point
  similarity_threshold: 0.75
  tune_threshold: true              # if true, sweep threshold on val set

evaluation:
  # Experiment 1: recurrence detection accuracy
  exp1_metrics: [f1, precision, recall, auroc]

  # Experiment 2: precision-recall sensitivity
  exp2_threshold_steps: 100        # number of threshold values to sweep

  # Experiment 3: noise robustness
  exp3_noise_levels: [0.05, 0.10, 0.20]   # fraction of feature range

  # Experiment 4: OOD generalization
  exp4_ood_scale: [4.0, 10.0]

  # Experiment 5: hard negative discrimination
  exp5_metric: auroc

ablation:
  # Loss functions
  loss_functions: [nt_xent, supcon, triplet]

  # Embedding dimensionalities
  embedding_dims: [8, 16, 32, 64, 128]

  # Encoder depths (number of hidden layers)
  n_layers: [1, 2, 3, 4]
  temperatures: [0.05, 0.07, 0.10, 0.20]
